
services:

  nginx:
    # Oluşturulacak Konteyner Adı
    container_name: nginx

    # Dockerfile dosya yolu
    build: ./requirements/nginx
    
    # Dinlenilecek : Yönlendirilecek portlar
    ports:
      - 443:443
    
    # Dosyaların saklanacağı dizin
    volumes:
      - wordpress_data:/var/www/html

    # Konteynerı otomatik olarak yeniden başlatır
    restart: always

    # Konteynerin bağlı olduğu ağ
    networks:
      - network

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    # Dependencies
    depends_on:
      wordpress:
        condition: service_healthy

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - network
    restart: always

    # .env dosyasındaki verileri ortam değişkenlerine atar
    env_file:
      - .env

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  wordpress:
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - network

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

# Hizmet verilerini saklar ve ana sistem ile bağlantı kurar.
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/data/mysql
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/data/wordpress
      o: bind

# Varsayılan ağ sürücüsüne bağlanır
networks:
  network:
    driver: bridge